# ══════════════════════════════════════════════════════════════════════
#  BUILD — runs on every push. Touches nothing on the live site.
#
#  It builds the site, checks the result for secrets, and attaches a
#  ready-to-upload ZIP to the run. No server password or key is involved,
#  so there is nothing here that can damage the live website.
#
#  Use it to get a fresh ZIP without running anything on your computer:
#  GitHub → Actions → the newest run → Artifacts → download.
# ══════════════════════════════════════════════════════════════════════
name: Build site

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # ── The build must never contain a secret ────────────────────────
      # A blocking check, not a warning. If a key ever reaches the built
      # site it is on every visitor's machine within minutes of a deploy,
      # so this stops the run rather than reporting and continuing.
      - name: Refuse to ship secrets
        run: |
          set -e
          fail=0

          if [ -f dist/api/config.php ]; then
            echo "::error::dist/api/config.php exists — the live secrets file must never be built"
            fail=1
          fi

          if grep -rIlE 'sk_(live|test)_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{24,}|key-[0-9a-f]{32}' dist 2>/dev/null | head; then
            echo "::error::a credential-shaped string is in the build output"
            fail=1
          fi

          # The browser bundle must not carry anything server-side.
          if grep -rIlE 'mailgun_key|sheets_token|admin_password_hash|stripe_secret' dist/assets 2>/dev/null | head; then
            echo "::error::a server-only setting name leaked into the browser bundle"
            fail=1
          fi

          # The diagnostic page is not part of a normal deployment.
          if [ -f dist/api/check.php ]; then
            echo "::error::check.php is in the build — it must not ship to production"
            fail=1
          fi

          # The one file that makes every page and the order form work.
          if [ ! -f dist/.htaccess ]; then
            echo "::error::dist/.htaccess is missing — the site would not route"
            fail=1
          fi

          exit $fail

      - name: Summarise
        run: |
          {
            echo "### Build ready"
            echo ""
            echo "- files: $(find dist -type f | wc -l)"
            echo "- size:  $(du -sh dist | cut -f1)"
            echo "- no secrets, no check.php, .htaccess present"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: streamplay4k-public_html
          path: dist/
          retention-days: 30
          include-hidden-files: true   # .htaccess, without which nothing routes
